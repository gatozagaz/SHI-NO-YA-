<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHI-NO ¡YA! - Catálogo y Compras</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">
                <div class="logo-text">
                    <span>SHI-NO ¡YA!</span>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="compra.html">Catálogo</a></li>
                    <li><a href="#">Mis Pedidos</a></li>
                </ul>
            </nav>
            <div class="nav-buttons">
                <a href="index.html" class="btn btn-secondary">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <main class="pagina-catalogo">
        <section class="tarjeta-catalogo">
            <h1>Catálogo de Productos</h1>
            <p class="subtitulo">Selecciona los productos que deseas ordenar:</p>
            <div class="linea-dorada"></div>

            <!-- Lista de productos que bajan verticalmente -->
            <div class="lista-productos">
                <div class="item-producto">
                    <div class="info-producto">
                        <span class="nombre-prod">Salchipapa Clásica</span>
                        <span class="precio-prod">$15.000</span>
                    </div>
                    <button class="btn-pedir">Escoger</button>
                </div>

                <div class="item-producto">
                    <div class="info-producto">
                        <span class="nombre-prod">Salchipapa Especial con Queso</span>
                        <span class="precio-prod">$20.000</span>
                    </div>
                    <button class="btn-pedir">Escoger</button>
                </div>

                <div class="item-producto">
                    <div class="info-producto">
                        <span class="nombre-prod">Salchipapa Mixta (Carne y Pollo)</span>
                        <span class="precio-prod">$25.000</span>
                    </div>
                    <button class="btn-pedir">Escoger</button>
                </div>

                <div class="item-producto">
                    <div class="info-producto">
                        <span class="nombre-prod">Bebida / Gaseosa 400ml</span>
                        <span class="precio-prod">$4.000</span>
                    </div>
                    <button class="btn-pedir">Escoger</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
